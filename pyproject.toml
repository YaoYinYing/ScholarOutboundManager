[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholar-outbound-manager"
version = "0.1.0"
description = "Conservative personal-use automation for generating Google Scholar-specific Xray outbound fragments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "yyy" }
]
dependencies = [
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]
tui = [
  "textual>=0.80,<1.0",
]
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "passlib[argon2]>=1.7",
  "pyotp>=2.9",
]

[project.scripts]
scholar-outbound-manager = "scholar_outbound_manager.cli:main"
scholar-outbound-manager-tui = "scholar_outbound_manager.tui.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["scholar_outbound_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
