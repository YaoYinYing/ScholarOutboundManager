# Example configuration for ScholarOutboundManager.

subscriptions:
  - name: "third_party_main"
    url: "https://example.invalid/subscription-1"
    format: "auto"
    enabled: true
    headers: {}

filters:
  include_keywords:
    - "scholar"
    - "google"
    - "academic"
    - "ipv4"
    - "clean"
  exclude_keywords:
    - "game"
    - "media"
  deprioritize_keywords:
    - "ipv6"
    - "warp"

probe:
  timeout_seconds: 15
  concurrency: 1
  cache_ttl_hours: 24
  failure_backoff_hours: 48
  allow_network_probe: false

xray:
  binary_path: "/usr/local/bin/xray"
  runtime_dir: ".runtime"
  local_socks_host: "127.0.0.1"
  local_socks_port: 0

output:
  outbounds_path: "generated/google_scholar_outbounds.json"
  routes_path: "generated/google_scholar_routes.json"
  manifest_path: "generated/google_scholar_manifest.json"
  history_dir: "state_data/history"

generation:
  tag_prefix: "google-scholar-node-"
  max_passed_nodes: 3
  fallback_blackhole_tag: "google-scholar-unavailable"
  previous_output_max_age_hours: 168

routing:
  mode: "dedicated_inbound"
  inbound_tags:
    - "google-scholar-in"
  fail_closed: true
